services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: barcamp
      POSTGRES_USER: barcamp
      POSTGRES_PASSWORD: barcamp
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    volumes:
      - app-data:/app/uploads

#  frontend:
#    build: ./frontend
#    ports:
#      - "3000:80"
#    depends_on:
#      - backend

volumes:
  app-data:
    driver: local